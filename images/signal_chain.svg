# Little Engineering Books

**Big Subjects. Small Books. No Waffle.**

Official website for Little Engineering Books — practical guides to electronics and analog circuits.

## Books

1. **Sensors** — Measuring the real world
2. **Op-Amps** — 12 essential circuits
3. **Analog and Digital Converters** — Bridging two worlds
4. **Digital Communications** — Getting data where it needs to go

## Development

This site is built with GitHub Pages and uses vanilla HTML, CSS, and the signal chain diagram.

- **Fonts**: Baloo 2 (headings), Work Sans (body)
- **Deployment**: GitHub Pages at littleengineeringbooks.github.io
- **Custom Domain**: littleengineeringbooks.com

## To Deploy

1. Push changes to the `main` branch
2. GitHub Pages will automatically build and deploy
3. Visit https://littleengineeringbooks.com

